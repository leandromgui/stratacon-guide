name: Apply Branch Ruleset

on:
  workflow_dispatch:
    inputs:
      ruleset_name:
        description: "Ruleset name (used to find/update an existing ruleset)"
        required: true
        default: "require-validate-breadcrumbs"
      branch_patterns:
        description: "Comma-separated branch patterns (e.g. main,develop,feature/**,fix/**,release/**)"
        required: true
        default: "main,develop,feature/**,fix/**,release/**"
      status_checks:
        description: "Comma-separated required status check contexts"
        required: true
        default: "validate-breadcrumbs"
      strict_updates:
        description: "Require branch to be up to date before merging"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      required_reviews:
        description: "Number of required approving reviews (0 to disable PR requirement)"
        required: false
        default: "1"
      enforcement:
        description: "Ruleset enforcement mode"
        required: false
        default: "active"
        type: choice
        options: ["active", "evaluate", "disabled"]
      dry_run:
        description: "Validate inputs and show payload without applying"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  push:
    paths:
      - .github/workflows/apply-branch-ruleset.yml

jobs:
  apply-ruleset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build ruleset payload
        id: build
        env:
          REPO: ${{ github.repository }}
          RULESET_NAME: ${{ github.event.inputs.ruleset_name || vars.RULESET_NAME || 'require-validate-breadcrumbs' }}
          BRANCH_PATTERNS: ${{ github.event.inputs.branch_patterns || vars.RULESET_BRANCH_PATTERNS || 'main,develop,feature/**,fix/**,release/**' }}
          STATUS_CHECKS: ${{ github.event.inputs.status_checks || vars.RULESET_STATUS_CHECKS || 'validate-breadcrumbs' }}
          STRICT_UPDATES: ${{ github.event.inputs.strict_updates || vars.RULESET_STRICT_UPDATES || 'true' }}
          REQUIRED_REVIEWS: ${{ github.event.inputs.required_reviews || vars.RULESET_REQUIRED_REVIEWS || '1' }}
          ENFORCEMENT: ${{ github.event.inputs.enforcement || vars.RULESET_ENFORCEMENT || 'active' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.RULESET_DRY_RUN || 'false' }}
        run: |
          set -euo pipefail

          # Build JSON arrays from comma-separated inputs using jq
          INCLUDE_JSON=$(echo "$BRANCH_PATTERNS" | jq -R -c '
            split(",") | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | map(if startswith("refs/heads/") then . else "refs/heads/" + . end)
          ')

          CHECKS_JSON=$(echo "$STATUS_CHECKS" | jq -R -c '
            split(",") | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | map({context: ., integration_id: null})
          ')

          RULES_JSON=$(jq -n \
            --argjson checks "$CHECKS_JSON" \
            --argjson strict "$([ "$STRICT_UPDATES" = "true" ] && echo true || echo false)" \
            --argjson reviews "$REQUIRED_REVIEWS" '
            [
              {type: "deletion"},
              {type: "non_fast_forward"},
              {
                type: "required_status_checks",
                parameters: {
                  strict_required_status_checks_policy: $strict,
                  required_status_checks: $checks
                }
              }
            ]
            + (if $reviews > 0 then [{
                type: "pull_request",
                parameters: {
                  required_approving_review_count: $reviews,
                  dismiss_stale_reviews_on_push: true,
                  require_code_owner_review: false,
                  require_last_push_approval: false,
                  required_review_thread_resolution: true
                }
              }] else [] end)
          ')

          jq -n \
            --arg name "$RULESET_NAME" \
            --arg enforcement "$ENFORCEMENT" \
            --argjson include "$INCLUDE_JSON" \
            --argjson rules "$RULES_JSON" '
            {
              name: $name,
              target: "branch",
              enforcement: $enforcement,
              bypass_actors: [],
              conditions: { ref_name: { include: $include, exclude: [] } },
              rules: $rules
            }
          ' > ruleset-payload.json

          echo "payload_path=ruleset-payload.json" >> "$GITHUB_OUTPUT"
          echo "ruleset_name=$RULESET_NAME" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "--- Validated Inputs ---"
          echo "ruleset_name:     $RULESET_NAME"
          echo "enforcement:      $ENFORCEMENT"
          echo "strict_updates:   $STRICT_UPDATES"
          echo "required_reviews: $REQUIRED_REVIEWS"
          echo "branch_patterns:  $BRANCH_PATTERNS"
          echo "status_checks:    $STATUS_CHECKS"
          echo "dry_run:          $DRY_RUN"

          # Validate non-empty arrays after parsing
          INCLUDE_COUNT=$(echo "$INCLUDE_JSON" | jq 'length')
          CHECKS_COUNT=$(echo "$CHECKS_JSON" | jq 'length')
          if [ "$INCLUDE_COUNT" -eq 0 ]; then
            echo "ERROR: branch_patterns resulted in an empty include list."
            exit 1
          fi
          if [ "$CHECKS_COUNT" -eq 0 ]; then
            echo "ERROR: status_checks resulted in an empty checks list."
            exit 1
          fi

          echo
          echo "Payload saved to ruleset-payload.json:"
          cat ruleset-payload.json | jq .

      - name: Validate ruleset payload
        run: |
          set -euo pipefail
          echo "Validating ruleset-payload.json..."

          # 1) JSON parse check
          if ! jq empty ruleset-payload.json 2>parse.err; then
            echo "ERROR: ruleset-payload.json is not valid JSON."
            cat parse.err
            exit 1
          fi

          # 2) Schema validation (required fields + type checks) via jq
          #    Emits one error line per issue; exits non-zero if any are found.
          ERRORS=$(jq -r '
            # Helpers
            def err($msg): "ERROR: " + $msg;
            def type_of($v): ($v | type);
            def expect_type($path; $val; $expected):
              if $val == null then err($path + " is required (missing or null)")
              elif ($val | type) != $expected then
                err($path + " must be of type " + $expected + ", got " + ($val | type))
              else empty end;
            def expect_nonempty_string($path; $val):
              expect_type($path; $val; "string"),
              (if ($val | type) == "string" and ($val | length) == 0
                then err($path + " must be a non-empty string") else empty end);
            def expect_nonempty_array($path; $val):
              expect_type($path; $val; "array"),
              (if ($val | type) == "array" and ($val | length) == 0
                then err($path + " must be a non-empty array") else empty end);
            def expect_enum($path; $val; $allowed):
              if ($val | IN($allowed[])) then empty
              else err($path + " must be one of " + ($allowed | tostring) + ", got " + ($val | tostring)) end;

            [
              # Top-level required fields and types
              expect_nonempty_string(".name"; .name),
              expect_enum(".target"; .target; ["branch","tag"]),
              expect_enum(".enforcement"; .enforcement; ["active","evaluate","disabled"]),
              expect_type(".bypass_actors"; .bypass_actors; "array"),

              # conditions.ref_name.include / exclude
              expect_type(".conditions"; .conditions; "object"),
              expect_type(".conditions.ref_name"; .conditions.ref_name; "object"),
              expect_nonempty_array(".conditions.ref_name.include"; .conditions.ref_name.include),
              expect_type(".conditions.ref_name.exclude"; .conditions.ref_name.exclude; "array"),

              # Every include/exclude entry must be a string
              ( (.conditions.ref_name.include // []) | to_entries[]
                | select((.value | type) != "string")
                | err(".conditions.ref_name.include[" + (.key|tostring) + "] must be a string, got " + (.value|type)) ),
              ( (.conditions.ref_name.exclude // []) | to_entries[]
                | select((.value | type) != "string")
                | err(".conditions.ref_name.exclude[" + (.key|tostring) + "] must be a string, got " + (.value|type)) ),

              # rules array
              expect_nonempty_array(".rules"; .rules),

              # Per-rule shape: each must be an object with a string type
              ( (.rules // []) | to_entries[]
                | (.key) as $i | (.value) as $r
                | ( if ($r | type) != "object"
                    then err(".rules[" + ($i|tostring) + "] must be an object")
                    else empty end ),
                  ( if ($r | type) == "object" and ($r.type | type) != "string"
                    then err(".rules[" + ($i|tostring) + "].type must be a string")
                    else empty end ) ),

              # required_status_checks rule: parameters typed correctly
              ( [.rules[]? | select(.type == "required_status_checks")] ) as $rsc
              | ( if ($rsc | length) == 0 then empty
                  else
                    ($rsc[0]) as $rule
                    | expect_type(".rules[required_status_checks].parameters"; $rule.parameters; "object"),
                      expect_type(
                        ".rules[required_status_checks].parameters.strict_required_status_checks_policy";
                        $rule.parameters.strict_required_status_checks_policy; "boolean"),
                      expect_nonempty_array(
                        ".rules[required_status_checks].parameters.required_status_checks";
                        $rule.parameters.required_status_checks),
                      ( ($rule.parameters.required_status_checks // []) | to_entries[]
                        | (.key) as $i | (.value) as $c
                        | ( if ($c | type) != "object"
                            then err(".rules[required_status_checks].parameters.required_status_checks[" + ($i|tostring) + "] must be an object")
                            elif ($c.context | type) != "string" or ($c.context | length) == 0
                            then err(".rules[required_status_checks].parameters.required_status_checks[" + ($i|tostring) + "].context must be a non-empty string")
                            else empty end ) end ),

              # pull_request rule (optional): if present, validate parameter types
              ( [.rules[]? | select(.type == "pull_request")] ) as $pr
              | ( if ($pr | length) == 0 then empty
                  else
                    ($pr[0]) as $rule
                    | expect_type(".rules[pull_request].parameters"; $rule.parameters; "object"),
                      expect_type(
                        ".rules[pull_request].parameters.required_approving_review_count";
                        $rule.parameters.required_approving_review_count; "number"),
                      ( if ($rule.parameters.required_approving_review_count // -1) < 0
                        then err(".rules[pull_request].parameters.required_approving_review_count must be >= 0")
                        else empty end ),
                      expect_type(
                        ".rules[pull_request].parameters.dismiss_stale_reviews_on_push";
                        $rule.parameters.dismiss_stale_reviews_on_push; "boolean"),
                      expect_type(
                        ".rules[pull_request].parameters.require_code_owner_review";
                        $rule.parameters.require_code_owner_review; "boolean"),
                      expect_type(
                        ".rules[pull_request].parameters.require_last_push_approval";
                        $rule.parameters.require_last_push_approval; "boolean"),
                      expect_type(
                        ".rules[pull_request].parameters.required_review_thread_resolution";
                        $rule.parameters.required_review_thread_resolution; "boolean") end )
            ] | .[]
          ' ruleset-payload.json || true)

          if [ -n "$ERRORS" ]; then
            echo "Schema validation failed:"
            echo "$ERRORS"
            exit 1
          fi

          echo "Payload schema validation passed."

      - name: Upload payload artifact
        if: steps.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ruleset-payload
          path: ruleset-payload.json

      - name: Apply repository ruleset
        if: steps.build.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REPO: ${{ github.repository }}
          RULESET_NAME: ${{ steps.build.outputs.ruleset_name }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Missing BRANCH_PROTECTION_TOKEN secret (PAT with 'repo' / 'Administration: write')."
            exit 1
          fi

          API="https://api.github.com/repos/$REPO/rulesets"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # Find existing ruleset by name
          EXISTING_ID=$(curl -fsSL "${AUTH[@]}" "$API?per_page=100" \
            | jq --arg name "$RULESET_NAME" '[.[] | select(.name == $name)][0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing ruleset id=$EXISTING_ID"
            curl -fsSL -X PUT "${AUTH[@]}" "$API/$EXISTING_ID" -d @ruleset-payload.json
          else
            echo "Creating new ruleset"
            curl -fsSL -X POST "${AUTH[@]}" "$API" -d @ruleset-payload.json
          fi

          echo
          echo "Ruleset '$RULESET_NAME' applied."
