name: Apply Branch Ruleset

on:
  workflow_dispatch:
    inputs:
      ruleset_name:
        description: "Ruleset name (used to find/update an existing ruleset)"
        required: true
        default: "require-validate-breadcrumbs"
      branch_patterns:
        description: "Comma-separated branch patterns (e.g. main,develop,feature/**,fix/**,release/**)"
        required: true
        default: "main,develop,feature/**,fix/**,release/**"
      status_checks:
        description: "Comma-separated required status check contexts"
        required: true
        default: "validate-breadcrumbs"
      strict_updates:
        description: "Require branch to be up to date before merging"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      required_reviews:
        description: "Number of required approving reviews (0 to disable PR requirement)"
        required: false
        default: "1"
      enforcement:
        description: "Ruleset enforcement mode"
        required: false
        default: "active"
        type: choice
        options: ["active", "evaluate", "disabled"]
      dry_run:
        description: "Validate inputs and show payload without applying"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  push:
    paths:
      - .github/workflows/apply-branch-ruleset.yml

jobs:
  apply-ruleset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Build ruleset payload
        id: build
        env:
          REPO: ${{ github.repository }}
          RULESET_NAME: ${{ github.event.inputs.ruleset_name || vars.RULESET_NAME || 'require-validate-breadcrumbs' }}
          BRANCH_PATTERNS: ${{ github.event.inputs.branch_patterns || vars.RULESET_BRANCH_PATTERNS || 'main,develop,feature/**,fix/**,release/**' }}
          STATUS_CHECKS: ${{ github.event.inputs.status_checks || vars.RULESET_STATUS_CHECKS || 'validate-breadcrumbs' }}
          STRICT_UPDATES: ${{ github.event.inputs.strict_updates || vars.RULESET_STRICT_UPDATES || 'true' }}
          REQUIRED_REVIEWS: ${{ github.event.inputs.required_reviews || vars.RULESET_REQUIRED_REVIEWS || '1' }}
          ENFORCEMENT: ${{ github.event.inputs.enforcement || vars.RULESET_ENFORCEMENT || 'active' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.RULESET_DRY_RUN || 'false' }}
        run: |
          set -euo pipefail

          # Build JSON arrays from comma-separated inputs using jq
          INCLUDE_JSON=$(echo "$BRANCH_PATTERNS" | jq -R -c '
            split(",") | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | map(if startswith("refs/heads/") then . else "refs/heads/" + . end)
          ')

          CHECKS_JSON=$(echo "$STATUS_CHECKS" | jq -R -c '
            split(",") | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
            | map({context: ., integration_id: null})
          ')

          RULES_JSON=$(jq -n \
            --argjson checks "$CHECKS_JSON" \
            --argjson strict "$([ "$STRICT_UPDATES" = "true" ] && echo true || echo false)" \
            --argjson reviews "$REQUIRED_REVIEWS" '
            [
              {type: "deletion"},
              {type: "non_fast_forward"},
              {
                type: "required_status_checks",
                parameters: {
                  strict_required_status_checks_policy: $strict,
                  required_status_checks: $checks
                }
              }
            ]
            + (if $reviews > 0 then [{
                type: "pull_request",
                parameters: {
                  required_approving_review_count: $reviews,
                  dismiss_stale_reviews_on_push: true,
                  require_code_owner_review: false,
                  require_last_push_approval: false,
                  required_review_thread_resolution: true
                }
              }] else [] end)
          ')

          jq -n \
            --arg name "$RULESET_NAME" \
            --arg enforcement "$ENFORCEMENT" \
            --argjson include "$INCLUDE_JSON" \
            --argjson rules "$RULES_JSON" '
            {
              name: $name,
              target: "branch",
              enforcement: $enforcement,
              bypass_actors: [],
              conditions: { ref_name: { include: $include, exclude: [] } },
              rules: $rules
            }
          ' > ruleset-payload.json

          echo "payload_path=ruleset-payload.json" >> "$GITHUB_OUTPUT"
          echo "ruleset_name=$RULESET_NAME" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "--- Validated Inputs ---"
          echo "ruleset_name:     $RULESET_NAME"
          echo "enforcement:      $ENFORCEMENT"
          echo "strict_updates:   $STRICT_UPDATES"
          echo "required_reviews: $REQUIRED_REVIEWS"
          echo "branch_patterns:  $BRANCH_PATTERNS"
          echo "status_checks:    $STATUS_CHECKS"
          echo "dry_run:          $DRY_RUN"

          # Validate non-empty arrays after parsing
          INCLUDE_COUNT=$(echo "$INCLUDE_JSON" | jq 'length')
          CHECKS_COUNT=$(echo "$CHECKS_JSON" | jq 'length')
          if [ "$INCLUDE_COUNT" -eq 0 ]; then
            echo "ERROR: branch_patterns resulted in an empty include list."
            exit 1
          fi
          if [ "$CHECKS_COUNT" -eq 0 ]; then
            echo "ERROR: status_checks resulted in an empty checks list."
            exit 1
          fi

          echo
          echo "Payload saved to ruleset-payload.json:"
          cat ruleset-payload.json | jq .

      - name: Validate ruleset payload
        id: validate
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Validating ruleset-payload.json..."

          # 1) JSON parse check
          if ! jq empty ruleset-payload.json 2>parse.err; then
            echo "ERROR: ruleset-payload.json is not valid JSON."
            cat parse.err
            # Emit a JSON report for parse failures too
            jq -n \
              --arg reason "ruleset-payload.json is not valid JSON" \
              --arg details "$(cat parse.err)" \
              '{ summary: { total: 1, hint: "Fix the JSON syntax in ruleset-payload.json." }, failures: [ { path: ".", expected: "valid JSON", actual: "parse error", value: $details, reason: $reason } ] }' \
              > validation-report.json
            {
              echo "## Validation Report"
              echo ""
              echo "The validation failed because the ruleset payload is not valid JSON."
              echo ""
              echo "**Download the full report:** [validation-report.json](https://github.com/$REPO/actions/runs/$RUN_ID#artifacts)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 2) Schema validation (required fields + type checks) via jq
          #    Emits one error line per issue; exits non-zero if any are found.
          ERRORS=$(jq -r -f .github/workflows/ruleset-schema.jq ruleset-payload.json || true)

          if [ -n "$ERRORS" ]; then
            ERROR_COUNT=$(echo "$ERRORS" | wc -l)
            echo "Schema validation failed:"
            echo "$ERRORS"
            echo
            echo "SUMMARY: $ERROR_COUNT schema validation failure(s) found."
            echo "HINT: Check the paths and expected types above, then update the workflow inputs or the ruleset-payload.json fields accordingly."

            # Build structured JSON report from error lines
            echo "$ERRORS" | jq -R -s '
              split("\n") | map(select(length > 0))
              | map(capture(
                  "ERROR \\| path=(?<path>[^|]+) \\| expected=(?<expected>[^|]+) \\| actual=(?<actual>[^|]+) \\| value=(?<value>[^|]+) \\| reason=(?<reason>.+)"
                ))
              | {
                  summary: {
                    total: length,
                    hint: "Check the paths and expected types, then update the workflow inputs or the ruleset-payload.json fields accordingly."
                  },
                  failures: .
                }
            ' > validation-report.json

            # Emit GitHub Actions annotations (Checks UI) for each failure.
            # Maps each JSON path (e.g. ".rules[0].parameters.type") to the exact
            # line/column in ruleset-payload.json by walking the parsed structure.
            FILE="ruleset-payload.json"

            # Path -> (line, col) resolver. Reads pretty-printed JSON and walks
            # object keys / array indices honoring nesting, quoted strings and
            # escapes — far more reliable than grepping the last path segment.
            cat > /tmp/locate_path.py <<'PY'
            import json, re, sys

            path_str = sys.argv[1]
            file_path = sys.argv[2]
            with open(file_path, "r", encoding="utf-8") as f:
                text = f.read()

            # Tokenize ".a.b[0].c" -> [("key","a"), ("key","b"), ("idx",0), ("key","c")]
            tokens = []
            for m in re.finditer(r'\.([A-Za-z_][A-Za-z0-9_]*)|\[(\d+)\]', path_str):
                if m.group(1) is not None:
                    tokens.append(("key", m.group(1)))
                else:
                    tokens.append(("idx", int(m.group(2))))

            def skip_ws(p):
                while p < len(text) and text[p] in " \t\r\n":
                    p += 1
                return p

            def skip_string(p):
                # assumes text[p] == '"'
                p += 1
                while p < len(text):
                    c = text[p]
                    if c == "\\":
                        p += 2
                        continue
                    if c == '"':
                        return p + 1
                    p += 1
                return p

            def skip_value(p):
                p = skip_ws(p)
                if p >= len(text):
                    return p
                c = text[p]
                if c == '"':
                    return skip_string(p)
                if c in "{[":
                    open_c, close_c = c, ("}" if c == "{" else "]")
                    depth = 1
                    p += 1
                    while p < len(text) and depth > 0:
                        ch = text[p]
                        if ch == '"':
                            p = skip_string(p); continue
                        if ch == open_c:
                            depth += 1
                        elif ch == close_c:
                            depth -= 1
                        p += 1
                    return p
                # primitive: number / true / false / null
                m = re.match(r"[^\s,\]\}]+", text[p:])
                return p + (len(m.group()) if m else 1)

            def line_col(p):
                line = text.count("\n", 0, p) + 1
                last_nl = text.rfind("\n", 0, p)
                col = p - last_nl if last_nl >= 0 else p + 1
                return line, col

            pos = skip_ws(0)
            target = pos
            try:
                for kind, val in tokens:
                    pos = skip_ws(pos)
                    if kind == "key":
                        if pos >= len(text) or text[pos] != "{":
                            break
                        pos += 1
                        found = False
                        while pos < len(text):
                            pos = skip_ws(pos)
                            if text[pos] == "}":
                                break
                            key_start = pos
                            key_end = skip_string(pos)
                            name = json.loads(text[key_start:key_end])
                            pos = skip_ws(key_end)
                            if text[pos] != ":":
                                break
                            pos = skip_ws(pos + 1)
                            if name == val:
                                target = key_start  # point at the key itself
                                found = True
                                break
                            pos = skip_value(pos)
                            pos = skip_ws(pos)
                            if pos < len(text) and text[pos] == ",":
                                pos += 1
                        if not found:
                            break
                    else:  # idx
                        if pos >= len(text) or text[pos] != "[":
                            break
                        pos += 1
                        for _ in range(val):
                            pos = skip_ws(pos)
                            pos = skip_value(pos)
                            pos = skip_ws(pos)
                            if pos < len(text) and text[pos] == ",":
                                pos += 1
                        pos = skip_ws(pos)
                        target = pos
            except Exception:
                pass

            line, col = line_col(target)
            print(f"{line} {col}")
            PY

            while IFS= read -r row; do
              FPATH=$(echo "$row" | jq -r '.path')
              EXPECTED=$(echo "$row" | jq -r '.expected')
              ACTUAL=$(echo "$row" | jq -r '.actual')
              REASON=$(echo "$row" | jq -r '.reason')

              # Resolve precise line + column by walking the JSON structure
              LINE=1
              COL=1
              if LOC=$(python3 /tmp/locate_path.py "$FPATH" "$FILE" 2>/dev/null); then
                LINE=$(echo "$LOC" | awk '{print $1}')
                COL=$(echo "$LOC" | awk '{print $2}')
                : "${LINE:=1}"
                : "${COL:=1}"
              fi

              # ::error annotations show up inline in the Checks tab on the file
              MSG="[$FPATH] expected=$EXPECTED, actual=$ACTUAL — $REASON"
              # Escape characters that have meaning in workflow commands
              MSG_ESCAPED=$(printf '%s' "$MSG" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
              echo "::error file=$FILE,line=$LINE,col=$COL,title=Ruleset schema validation failure::${MSG_ESCAPED}"
            done < <(jq -c '.failures[]' validation-report.json)

            # Aggregate annotations per file: when several failures share the
            # same file, emit a single grouped ::error annotation summarizing
            # all of them so the Checks/Annotations tab shows one entry per
            # file in addition to the per-failure annotations above.
            jq -r '
              .failures
              | map(. + { file: (.file // "ruleset-payload.json") })
              | group_by(.file)
              | map({ file: .[0].file, count: length, items: . })
              | .[]
              | @base64
            ' validation-report.json | while IFS= read -r enc; do
              GROUP=$(echo "$enc" | base64 -d)
              GFILE=$(echo "$GROUP" | jq -r '.file')
              GCOUNT=$(echo "$GROUP" | jq -r '.count')
              if [ "$GCOUNT" -le 1 ]; then
                continue
              fi
              GLIST=$(echo "$GROUP" | jq -r '
                .items[:10]
                | map("• \(.path): expected=\(.expected), actual=\(.actual) — \(.reason)")
                | join(" | ")
              ')
              GEXTRA=""
              if [ "$GCOUNT" -gt 10 ]; then
                GEXTRA=" | ...and $((GCOUNT - 10)) more"
              fi
              GMSG="$GCOUNT validation failures in $GFILE: ${GLIST}${GEXTRA}"
              GMSG_ESCAPED=$(printf '%s' "$GMSG" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
              echo "::error file=$GFILE,line=1,col=1,title=Ruleset validation: $GCOUNT failures in $GFILE::${GMSG_ESCAPED}"
            done

            {
              echo "## Validation Report"
              echo ""
              echo "Found **$ERROR_COUNT** schema validation failure(s)."
              echo ""
              echo "**Download the full report:** [validation-report.json](https://github.com/$REPO/actions/runs/$RUN_ID#artifacts)"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "Payload schema validation passed."

      - name: Upload payload artifact
        if: steps.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ruleset-payload
          path: ruleset-payload.json

      - name: Upload validation report
        if: failure() && steps.validate.outcome == 'failure'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ruleset-validation-report
          path: validation-report.json

      - name: Write validation summary link
        if: failure() && steps.validate.outcome == 'failure'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Validation report artifact uploaded." >> "$GITHUB_STEP_SUMMARY"
          echo "Download it here: https://github.com/$REPO/actions/runs/$RUN_ID#artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with validation report link
        if: failure() && steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --repo "$REPO" --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for this branch; skipping comment."
            exit 0
          fi

          TOTAL=$(jq '.summary.total' validation-report.json)
          SUMMARY_MD=$(jq -r '
            .failures[:5]
            | map("- `\(.path)`: esperado `\(.expected)`, encontrado `\(.actual)` — \(.reason)")
            | join("\n")
          ' validation-report.json)

          if [ "$TOTAL" -gt 5 ]; then
            SUMMARY_MD="${SUMMARY_MD}\n\n_...e mais $((TOTAL - 5)) falha(s) no relatório completo._"
          fi

          BODY=$(printf "❌ A validação do ruleset falhou com **%s** erro(s) de schema.\n\n**Principais falhas:**\n%s\n\n📎 [Baixar relatório completo (validation-report.json)](https://github.com/%s/actions/runs/%s#artifacts)" "$TOTAL" "$SUMMARY_MD" "$REPO" "$RUN_ID")
          MARKER='<!-- ruleset-validation-report -->'
          FULL_BODY="${MARKER}\n${BODY}"

          # Search for an existing comment with the hidden marker
          EXISTING_COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq \
            ".[] | select(.body | contains(\"$MARKER\")) | .id")

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment $EXISTING_COMMENT_ID"
            gh api "repos/$REPO/issues/comments/$EXISTING_COMMENT_ID" --method PATCH -f body="$FULL_BODY"
          else
            echo "Creating new PR comment"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$FULL_BODY"
          fi

      - name: Apply repository ruleset
        if: steps.build.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REPO: ${{ github.repository }}
          RULESET_NAME: ${{ steps.build.outputs.ruleset_name }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Missing BRANCH_PROTECTION_TOKEN secret (PAT with 'repo' / 'Administration: write')."
            exit 1
          fi

          API="https://api.github.com/repos/$REPO/rulesets"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # Find existing ruleset by name
          EXISTING_ID=$(curl -fsSL "${AUTH[@]}" "$API?per_page=100" \
            | jq --arg name "$RULESET_NAME" '[.[] | select(.name == $name)][0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing ruleset id=$EXISTING_ID"
            curl -fsSL -X PUT "${AUTH[@]}" "$API/$EXISTING_ID" -d @ruleset-payload.json
          else
            echo "Creating new ruleset"
            curl -fsSL -X POST "${AUTH[@]}" "$API" -d @ruleset-payload.json
          fi

          echo
          echo "Ruleset '$RULESET_NAME' applied."
