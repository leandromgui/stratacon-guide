name: Test Ruleset Validation

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**"]
    paths:
      - .github/workflows/ruleset-schema.jq
      - .github/workflows/test-ruleset-validation.yml
      - scripts/locate-json-path.py
      - scripts/test-ruleset-validation.sh
  pull_request:
    paths:
      - .github/workflows/ruleset-schema.jq
      - .github/workflows/test-ruleset-validation.yml
      - scripts/locate-json-path.py
      - scripts/test-ruleset-validation.sh

permissions:
  contents: read

jobs:
  e2e:
    name: Ruleset validation e2e (Python ${{ matrix.python-version }} / jq ${{ matrix.jq-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
        jq-version: ["1.6", "1.7.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq ${{ matrix.jq-version }}
        run: |
          set -euo pipefail
          case "${{ matrix.jq-version }}" in
            1.6)
              url="https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64"
              ;;
            1.7.1)
              url="https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64"
              ;;
            *)
              echo "Unsupported jq version: ${{ matrix.jq-version }}" >&2
              exit 1
              ;;
          esac
          sudo curl -fsSL "$url" -o /usr/local/bin/jq
          sudo chmod +x /usr/local/bin/jq
          hash -r
          installed="$(jq --version)"
          echo "Installed: $installed"
          case "$installed" in
            jq-${{ matrix.jq-version }}*) ;;
            *) echo "Version mismatch: expected jq-${{ matrix.jq-version }}, got $installed" >&2; exit 1 ;;
          esac

      - name: Run end-to-end test
        env:
          RESOLVER_OUTPUT: ${{ github.workspace }}/resolver-output.txt
        run: bash scripts/test-ruleset-validation.sh

      - name: Normalize resolver output before upload
        run: |
          set -euo pipefail
          f="${{ github.workspace }}/resolver-output.txt"
          # Normalize: trim trailing whitespace, remove blank/whitespace-only lines,
          # ensure LF line endings, and guarantee exactly one trailing newline.
          awk 'NF {gsub(/[ \t]+$/, ""); print}' "$f" > "$f.tmp"
          # Collapse consecutive spaces/tabs into a single space
          tr -s ' \t' ' ' < "$f.tmp" > "$f.tmp2"
          # Strip any stray carriage returns (CRLF -> LF)
          tr -d '\r' < "$f.tmp2" > "$f"
          rm "$f.tmp" "$f.tmp2"

      - name: Upload resolver output
        uses: actions/upload-artifact@v4
        with:
          name: resolver-output-py${{ matrix.python-version }}-jq${{ matrix.jq-version }}
          path: resolver-output.txt
          if-no-files-found: error

  compare:
    name: Compare resolver output across jq versions
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Download all resolver outputs
        uses: actions/download-artifact@v4
        with:
          path: outputs
          pattern: resolver-output-*

      - name: Normalize resolver outputs before comparison
        run: |
          set -euo pipefail
          for f in outputs/*/resolver-output.txt; do
            # Normalize: trim trailing whitespace, remove blank/whitespace-only lines,
            # ensure LF line endings, and guarantee exactly one trailing newline.
            awk 'NF {gsub(/[ \t]+$/, ""); print}' "$f" > "$f.tmp"
            # Collapse consecutive spaces/tabs into a single space
            tr -s ' \t' ' ' < "$f.tmp" > "$f.tmp2"
            # Strip any stray carriage returns (CRLF -> LF)
            tr -d '\r' < "$f.tmp2" > "$f"
            rm "$f.tmp" "$f.tmp2"
          done

      - name: Diff resolver output across jq versions
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t dirs < <(ls -1d outputs/resolver-output-* | sort)
          if [ "${#dirs[@]}" -lt 2 ]; then
            echo "FAIL: expected at least 2 resolver-output artifacts, got ${#dirs[@]}" >&2
            exit 1
          fi
          echo "Found ${#dirs[@]} artifacts:"
          printf '  %s\n' "${dirs[@]}"

          reference="${dirs[0]}/resolver-output.txt"
          if [ ! -s "$reference" ]; then
            echo "FAIL: reference output $reference is missing or empty" >&2
            exit 1
          fi

          divergence=0
          for d in "${dirs[@]:1}"; do
            candidate="$d/resolver-output.txt"
            if ! diff -u "$reference" "$candidate"; then
              echo "FAIL: resolver output diverges between $reference and $candidate" >&2
              divergence=1
            fi
          done

          if [ "$divergence" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: resolver output is identical across all Python x jq combinations."