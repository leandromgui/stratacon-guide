name: Test Ruleset Validation

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**"]
    paths:
      - .github/workflows/ruleset-schema.jq
      - .github/workflows/test-ruleset-validation.yml
      - scripts/locate-json-path.py
      - scripts/test-ruleset-validation.sh
  pull_request:
    paths:
      - .github/workflows/ruleset-schema.jq
      - .github/workflows/test-ruleset-validation.yml
      - scripts/locate-json-path.py
      - scripts/test-ruleset-validation.sh

permissions:
  contents: read

jobs:
  e2e:
    name: Ruleset validation e2e (Python ${{ matrix.python-version }} / jq ${{ matrix.jq-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
        jq-version: ["1.6", "1.7.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq ${{ matrix.jq-version }}
        run: |
          set -euo pipefail
          case "${{ matrix.jq-version }}" in
            1.6)
              url="https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64"
              ;;
            1.7.1)
              url="https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64"
              ;;
            *)
              echo "Unsupported jq version: ${{ matrix.jq-version }}" >&2
              exit 1
              ;;
          esac
          sudo curl -fsSL "$url" -o /usr/local/bin/jq
          sudo chmod +x /usr/local/bin/jq
          hash -r
          installed="$(jq --version)"
          echo "Installed: $installed"
          case "$installed" in
            jq-${{ matrix.jq-version }}*) ;;
            *) echo "Version mismatch: expected jq-${{ matrix.jq-version }}, got $installed" >&2; exit 1 ;;
          esac

      - name: Run end-to-end test
        run: bash scripts/test-ruleset-validation.sh