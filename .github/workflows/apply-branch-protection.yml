name: Apply Branch Protection

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-branch-protection.yml

jobs:
  apply-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Apply branch protection to main
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing BRANCH_PROTECTION_TOKEN secret (PAT with 'repo' or fine-grained 'Administration: write')."
            exit 1
          fi

          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/branches/main/protection" \
            -d '{
              "required_status_checks": {
                "strict": true,
                "contexts": ["validate-breadcrumbs"]
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews": true
              },
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "required_linear_history": false,
              "required_conversation_resolution": true
            }'

          echo "Branch protection applied to main."